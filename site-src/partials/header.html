<!-- ONE copy of the header, stamped onto every generated page by scripts\Build-Site.ps1. Editing
     this file changes every page's header at once — that is the whole point of templating it.

     MARK GEOMETRY IS LOCKED TO assets\make-icon.ps1 AND TO THE FAVICON IN site-src\layout.html.
     All three draw the same polyline on the same 16-unit grid; scripts\Check-MarkGeometry.ps1
     checks the generated site\index.html and site\holding.html against the canonical points in
     make-icon.ps1 — if you change the points here, re-run Build-Site.ps1 and Check-MarkGeometry.ps1
     in the same commit. -->
<header class="site-header">
  <a class="brand" href="/">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="1" y="1" width="14" height="14" rx="3.5" fill="#17191E"/>
      <polyline points="4.631,2.512 9.387,11.495 11.325,7.620" fill="none" stroke="#2BD16B" stroke-width="2.6"/>
    </svg>
    <span>FlashDesk</span>
  </a>
  <nav class="site-nav" aria-label="Site">
    <a href="/" data-nav="home">Home</a>
    <a href="/how-it-works/" data-nav="how-it-works">How it works</a>
    <a href="/privacy/" data-nav="privacy">Privacy</a>
    <a href="/faq/" data-nav="faq">FAQ</a>
    <a href="/terms/" data-nav="terms">Terms</a>
  </nav>
</header>

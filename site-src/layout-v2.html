<head>

<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<!--
  GENERATED FILE — do not hand-edit. Source: site-src\pages\{{SLUG}}.html, assembled by
  scripts\Build-Site.ps1 from site-src\layout-v2.html + site-src\partials\*-v2.html.

  ⚠ THIS IS THE ROUND-4 REDESIGN TRACK. UPDATED 2026-09-15 — it is now the WHOLE SITE, not one
  track of two. Conor's own build order for the rollout: design the system, build Home completely
  in it, build ONE inner page to prove it scales, then WAIT for a verdict before the rest — that
  wait ended 2026-09-09 (commit 6f33070), when Privacy, FAQ and Terms were ported onto this same
  track. All six pages (Home, How-it-works, Privacy, FAQ, Terms, Security-warning) render from
  this file now (see scripts\Build-Site.ps1's LAYOUT front-matter key — every page source under
  site-src\pages\ currently sets LAYOUT: v2). The v1 files (layout.html, site.css,
  partials\header.html/footer.html) still exist in this repository but are orphaned — no page
  references them — kept only because deleting them was never asked for, not because two designs
  are still meant to coexist.

  WHY THE PALETTE CHANGED FROM DARK+GREEN TO LIGHT: see site-v2.css's own header comment for the
  full argument (research-backed, not taste) — six real competitor/trust-product sites were fetched
  and read directly, six of six are light-dominant, and dark+acid-green reads as the hacking/crypto
  genre to exactly the frightened non-technical visitor this page exists for.

  Nothing on this page loads from another host — same rule as the v1 track, unchanged.
-->

<!-- MARK GEOMETRY IS LOCKED to assets\make-icon.ps1 — see site-src\partials\header-v2.html for the
     full note. The mark's SHAPE is unchanged this round (Conor: "it took seven rounds and it is
     earned"); only where and in what colour it appears changed. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20x='1'%20y='1'%20width='14'%20height='14'%20rx='3.5'%20fill='%2317191E'/%3E%3Cpolyline%20points='4.631,2.512%209.387,11.495%2011.325,7.620'%20fill='none'%20stroke='%232BD16B'%20stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/site-v2.css">
</head>
<body>
<!-- Skip link — first focusable element; announced by screen readers before the header. -->
<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- -----------------------------------------------------------------------------------------
     THE ICON SET — one sprite, defined once, used everywhere via <svg class="icon"><use
     href="#i-NAME"/></svg>. Built round 4 (2026-09-04) per Conor's instruction: "a coherent icon
     set in the mark's own language — same stroke weight, same angles." Design rules, applied to
     every icon below with no exception:
       - 24x24 viewBox, stroke-width 2, stroke="currentColor" (tints via CSS `color`), fill: none
       - stroke-linecap: butt, stroke-linejoin: miter — the mark uses flat caps and a sharp miter
         join (that sharp corner is exactly what nearly clipped the mark itself once — see
         make-icon.ps1's own history — so it is treated with the same care here)
       - straight lines and rectangles ONLY. No circles, no curves anywhere in this set. The mark
         itself is two straight segments and nothing else; every icon here is built from the same
         restricted vocabulary so the family reads as one language, not eleven separate ideas that
         happen to share a stroke width
       - icon-screen's inner mark deliberately echoes the brand mark's own descending-then-rising
         proportion (long stroke down, short stroke up) at a smaller scale — the one icon allowed
         to directly quote the mark, because it depicts the one thing only the mark's own shape
         means: a cursor moving on a screen that is not physically yours
     ----------------------------------------------------------------------------------------- -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    
      <symbol id="i-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="2" y="3" width="20" height="14"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
        <polyline points="9,7 13,15 15.5,10.5"/>
      </symbol>
      <!-- ⚠ REDESIGNED — an independent review found this too similar to i-band (both were "a
           rectangle with a line near the top"). Now a smaller, centred dialog with two actual
           button RECTANGLES (not lines) at the bottom, reading unambiguously as "a decision with
           two buttons" rather than "a window with a divider." -->
      <symbol id="i-dialog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="4" y="5" width="16" height="13"/>
        <line x1="4" y1="9" x2="20" y2="9"/>
        <rect x="7" y="12.5" width="4" height="3"/>
        <rect x="13" y="12.5" width="4" height="3"/>
      </symbol>
      <symbol id="i-band" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="2" y="3" width="20" height="16"/>
        <line x1="2" y1="7.5" x2="22" y2="7.5" stroke-width="3"/>
      </symbol>
      <symbol id="i-log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="5" y="2" width="14" height="20"/>
        <line x1="8" y1="7" x2="16" y2="7"/>
        <line x1="8" y1="11" x2="16" y2="11"/>
        <line x1="8" y1="15" x2="14" y2="15"/>
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <polyline points="6,2 6,22 18,22 18,8 12,2 6,2"/>
        <polyline points="12,2 12,8 18,8"/>
      </symbol>
      <!-- ⚠ REDESIGNED — an independent review found the original (three separate small blocks)
           read ambiguously as a "more options" ellipsis or a loading indicator. Now ONE field
           divided by two internal dividers — reads specifically as "one number, grouped in
           three," matching the actual 9-digit-in-three-groups format, not a generic UI glyph. -->
      <symbol id="i-address" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="2" y="8" width="20" height="8"/>
        <line x1="9.33" y1="8" x2="9.33" y2="16"/>
        <line x1="16.67" y1="8" x2="16.67" y2="16"/>
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <polyline points="2,6 2,20 22,20 22,8 11,8 9,6 2,6"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="7" y="7" width="14" height="14"/>
        <polyline points="17,7 17,3 3,3 3,17 7,17"/>
      </symbol>
      <symbol id="i-arrival" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="3" y="9" width="12" height="12"/>
        <polyline points="14,4 21,4 21,11"/>
        <line x1="21" y1="4" x2="10" y2="15"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="4" y1="4" x2="20" y2="20"/>
        <line x1="20" y1="4" x2="4" y2="20"/>
      </symbol>
      <symbol id="i-monitors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <rect x="2" y="4" width="12" height="9"/>
        <rect x="12" y="8" width="10" height="8"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="12" y1="3" x2="12" y2="15"/>
        <polyline points="6,10 12,16 18,10"/>
        <line x1="4" y1="21" x2="20" y2="21"/>
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="4" y1="12" x2="20" y2="12"/>
        <polyline points="14,6 20,12 14,18"/>
      </symbol>
  </defs>
</svg>

<div class="page">
{{HEADER}}
<main id="main-content">
{{CONTENT}}
</main>
{{FOOTER}}
</div>
</body>
</html>
